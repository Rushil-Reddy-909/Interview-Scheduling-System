spring.application.name=interview-scheduling

# H2 file database: data is kept on disk in ./data and survives restarts.
# Created automatically on first run. Delete the folder to reset the data.
spring.datasource.url=jdbc:h2:file:./data/interview-scheduling;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# One local user per role, created when that role is missing.
# Email is the role in lowercase plus @localhost.
# Change the password before this app is used outside a local database.
app.admin.password=12345678

# Sample people and interviews around next Monday, inserted only while the interview table is empty.
app.seed.demo=true

# Local inspection only. Do not expose this once the app is deployed.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
