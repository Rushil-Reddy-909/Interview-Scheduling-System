spring.application.name=interview-scheduling

# H2 file database: data is kept on disk in ./data and survives restarts.
# Created automatically on first run. Delete the folder to reset the data.
spring.datasource.url=jdbc:h2:file:./data/interview-scheduling;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Local bootstrap admin, created only when no ADMIN user exists.
# Change both values before this app is used outside a local database.
app.admin.email=admin@localhost
app.admin.password=12345678

# Local inspection only. Do not expose this once the app is deployed.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
